---
name: Test galaxy_version injection with build-only
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          api_key: dummy-api-key-not-used-for-build-only
          collection_dir: ./tests/fixtures/collection
          build: "true"
          publish: "false"
          galaxy_version: "2.3.4"

      - name: Assert build artifact was created with injected version
        run: |
          echo "Checking for built collection artifact with version 2.3.4..."
          # ansible-galaxy collection build places the artifact in the current working directory
          ARTIFACT=$(find "$GITHUB_WORKSPACE" -maxdepth 2 -name "*2.3.4*.tar.gz" 2>/dev/null | head -1)
          echo "artifact: $ARTIFACT"
          if [ -z "$ARTIFACT" ]; then
            echo "Listing all artifacts found:"
            find "$GITHUB_WORKSPACE" -maxdepth 2 -name "*.tar.gz" 2>/dev/null || true
            ls -la "$GITHUB_WORKSPACE/" || true
            echo "FAIL: expected a .tar.gz artifact containing version 2.3.4"
            exit 1
          fi
          echo "PASS: found versioned artifact $ARTIFACT"
