---
name: Test galaxy_version injection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure fixture collection is present
        run: |
          ls -la "$GITHUB_WORKSPACE/tests/fixtures/fake_collection/"
          cat "$GITHUB_WORKSPACE/tests/fixtures/fake_collection/galaxy.yml"

      - id: action
        uses: .
        with:
          api_key: dummy-api-key-not-used-for-build-only
          collection_dir: ./tests/fixtures/fake_collection/
          build: "true"
          publish: "false"
          galaxy_version: "3.2.1"

      - name: Assert build artifact with injected version was created
        run: |
          # ansible-galaxy collection build creates the artifact in the CWD ($GITHUB_WORKSPACE)
          # The artifact is named <namespace>-<name>-<version>.tar.gz
          echo "Listing workspace for artifacts:"
          ls -la "$GITHUB_WORKSPACE"/*.tar.gz 2>/dev/null || true
          ARTIFACT=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -name "*.tar.gz" 2>/dev/null | head -1)
          echo "artifact: $ARTIFACT"
          if [ -z "$ARTIFACT" ]; then
            echo "FAIL: expected a built .tar.gz artifact in $GITHUB_WORKSPACE but none was found"
            exit 1
          fi
          # The artifact filename should contain the injected version 3.2.1
          if echo "$ARTIFACT" | grep -q "3.2.1"; then
            echo "PASS: artifact contains injected version 3.2.1"
          else
            echo "FAIL: artifact filename does not contain injected version 3.2.1: $ARTIFACT"
            exit 1
          fi
