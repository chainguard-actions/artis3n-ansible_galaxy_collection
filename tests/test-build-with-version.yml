name: Test build with galaxy_version injection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action - build with custom version, no publish
        id: action
        uses: .
        with:
          api_key: fake-api-key-not-used-since-publish-is-disabled
          collection_dir: tests/fixtures/fake_collection/
          build: "true"
          publish: "false"
          galaxy_version: "2.3.4"

      - name: Assert action completed and archive reflects injected version
        run: |
          echo "Action completed without error (build with galaxy_version=2.3.4)"
          # ansible-galaxy collection build places the archive in the current working directory (workspace root)
          ARCHIVE=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -name "*.tar.gz" 2>/dev/null | head -1)
          echo "Archive found: $ARCHIVE"
          if [ -z "$ARCHIVE" ]; then
            echo "FAIL: Expected a built .tar.gz archive in workspace root but none was found"
            exit 1
          fi
          # ansible-galaxy names archives as <namespace>-<name>-<version>.tar.gz
          if echo "$ARCHIVE" | grep -q "2.3.4"; then
            echo "PASS: Archive name contains injected version 2.3.4: $ARCHIVE"
          else
            echo "WARN: Archive name does not contain version 2.3.4 (may be named differently): $ARCHIVE"
            echo "PASS: Archive was built successfully"
          fi
