name: Test build-only (no publish)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action in build-only mode
        uses: .
        with:
          api_key: fake-api-key-not-used-for-build
          collection_dir: tests/fixtures/fake_collection
          build: "true"
          publish: "false"

      - name: Assert collection archive was built
        run: |
          echo "Checking for built collection archive..."
          ARCHIVE=$(find . -name "testnamespace-test_collection-*.tar.gz" 2>/dev/null | head -1)
          echo "Found archive: $ARCHIVE"
          if [ -z "$ARCHIVE" ]; then
            echo "FAIL: expected a .tar.gz collection archive to be created"
            exit 1
          fi
          echo "PASS: collection archive found at $ARCHIVE"
