---
name: Test skip build and publish
on:
  workflow_dispatch:
jobs:
  test-skip-build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture collection to workspace
        run: |
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/collection" \
            "$GITHUB_WORKSPACE/test-collection"

      - id: action
        uses: .
        with:
          api_key: "fake-api-key-not-used"
          collection_dir: "./test-collection"
          build: "false"
          publish: "false"

      - name: Assert action completed without error
        run: |
          echo "Action completed successfully with build=false and publish=false"
          echo "PASS"
