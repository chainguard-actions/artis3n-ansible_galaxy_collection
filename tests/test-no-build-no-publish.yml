---
name: Test no-build no-publish (skip both)
on:
  workflow_dispatch:
jobs:
  test-no-build-no-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          api_key: "dummy-api-key-not-used"
          collection_dir: "./tests/fixtures/collection"
          build: "false"
          publish: "false"

      - name: Assert no tarball was built (build was disabled)
        run: |
          echo "Verifying no tarball was built when build=false..."
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          TARBALL=$(find "$GITHUB_WORKSPACE" -name "testnamespace-testcollection-*.tar.gz" 2>/dev/null | head -1)
          echo "Tarball found: '${TARBALL}'"
          if [ -n "$TARBALL" ]; then
            echo "FAIL: Unexpected tarball found when build=false: $TARBALL"
            exit 1
          fi
          echo "PASS: No tarball built as expected when build=false and publish=false"
